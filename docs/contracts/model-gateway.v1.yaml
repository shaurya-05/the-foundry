contract: model_gateway
version: 1
title: Model Gateway
status: stable
owns: >
  The model registry, tier routing, provider adapters, circuit breakers, and the
  measured-fitness data that routing decisions are made from.

surface: internal
facade: app/services/model_gateway.py
moved: 2026-09-29   # Stage 4, service 1 of 4
# No HTTP surface today. Described as messages rather than function signatures
# anyway: after Phase B this may well be a network call, and a contract written
# as `async def route_query(...)` would have to be rewritten at exactly the
# moment nobody has spare attention.

owns_tables:
  - model_registry
  - model_usage_log

invariants:
  - id: MG-1
    rule: >
      A tier is selected by measured fitness, never by assumption. Nothing may
      hardcode a model id for a tier outside the registry.
  - id: MG-2
    rule: >
      Every completion reports the model that ACTUALLY answered. After a
      provider failover the reported model is the one that produced the tokens,
      not the one that was asked first.
  - id: MG-3
    rule: >
      Callers name a TIER, never a model. A caller that names a model has
      pinned a routing decision it does not own.
  - id: MG-4
    rule: >
      A tripped circuit breaker is a property of the gateway, not of the
      caller. Callers do not implement their own retry or fallback.

operations:

  route_query:
    summary: Route a prompt to the appropriate tier and stream the answer.
    request:
      type: object
      required: [tier, messages]
      properties:
        tier:
          type: string
          enum: [CLASSIFIER, FACTUAL, RESEARCH, DOCUMENT, VISION]
          description: >
            VISION is declared here before it exists. Phase A's vision work adds
            a tier row and a provider adapter; it does not add a new contract.
        messages:
          type: array
          items:
            type: object
            required: [role, content]
            properties:
              role: { type: string, enum: [system, user, assistant] }
              content: { type: string }
        max_tokens: { type: integer, minimum: 1 }
        model_override:
          type: string
          description: >
            Dev-time escape hatch only. Present because it exists today; it
            violates MG-3 by construction and must not be used by any service.
    response:
      type: object
      description: A stream. Text deltas, then a final usage record.
      properties:
        deltas:
          type: array
          items: { type: string }
        model_used:
          type: string
          description: >
            The model that produced the tokens. MG-2. Emitted again as a
            correction if a failover occurred mid-stream.
        tier: { type: string }
        tokens_in: { type: integer }
        tokens_out: { type: integer }
        latency_ms: { type: number }
    errors:
      - tier_not_configured      # no provider for this tier
      - all_providers_failed     # every fallback in the chain failed
      - breaker_open             # tier refused before a call was attempted

  classify_query:
    summary: Classify a query into a tier without answering it.
    request:
      type: object
      required: [query]
      properties:
        query: { type: string }
    response:
      type: object
      properties:
        tier: { type: string }
    errors:
      - all_providers_failed

  registry_health:
    summary: Per-tier health, warmth and VRAM residency.
    request:
      type: object
      properties: {}
    response:
      type: object
      additionalProperties:
        type: object
        properties:
          healthy: { type: boolean }
          provider: { type: string }
          model_name: { type: string }
          warm: { type: boolean }
          size_vram_bytes: { type: [integer, "null"] }
          expires_at: { type: [string, "null"], format: date-time }
    errors: []

  refresh_measured_fitness:
    summary: Recompute rolling fitness from recent usage and write it back.
    request:
      type: object
      properties:
        window_days: { type: integer, default: 7, minimum: 1 }
    response:
      type: object
      properties:
        models_updated: { type: integer }
    errors:
      - registry_unavailable

  breaker_status:
    summary: Circuit-breaker state for every connector.
    request:
      type: object
      properties: {}
    response:
      type: array
      items:
        type: object
        properties:
          connector: { type: string }
          state: { type: string, enum: [closed, open, unknown] }
          recent_failures: { type: integer }
          cooldown_remaining_s: { type: integer }
    errors: []

emits:
  # Via the observability contract, never by writing spans or metrics directly.
  metrics:
    - model.latency_ms        # labels: model, tier
    - model.tokens_per_second # labels: model, tier
    - model.tokens_out        # labels: model, tier
    - vram.model_bytes        # labels: tier, model
    - vram.total_bytes
    - circuit_breaker.closed  # labels: connector
    - circuit_breaker.failure # labels: connector

known_gaps:
  - id: MG-GAP-1
    rule: MG-2
    status: verified_already_correct
    detail: >
      Re-examined during the Stage 4 move. The streaming route path DOES emit a
      ("model_used", <label>) correction when call_with_resilience falls back to
      a different provider, and copilot.py handles both the bare string and the
      tuple. No change was made, because none was needed -- recorded rather than
      claiming a fix. The residual exposure is MG-GAP-2: callers using
      stream_direct report no model at all, because they never asked a tier.
  - id: MG-GAP-2
    rule: MG-3
    detail: >
      Eight modules call stream_direct/complete_direct, which go straight to
      Anthropic and bypass tier routing entirely -- naming a provider rather
      than a tier. They now do so THROUGH the facade, so the bypass is countable
      and enforced-adjacent rather than invisible. Converting them changes which
      model answers, so it is its own change, not part of a move.
  - id: MG-GAP-3
    rule: MG-3
    detail: >
      agent_loop, h3ro_style and watch_service take a provider object out of the
      registry via get_provider() and call it themselves, inheriting none of the
      resilience wrapper route() would apply. Same reasoning: exposed through
      the one door so it is countable, converted separately.

changelog:
  - version: 1
    date: 2026-09-29
    note: Initial extraction. Describes existing behaviour; nothing moved.
  - version: 1
    date: 2026-09-29
    note: >
      Stage 4 move. Additive, no version bump: app/services/model_gateway.py is
      now the facade and every other service imports only it, enforced by
      scripts/check_service_imports.py. circuit_breaker moved OUT of this
      service to the shared resilience substrate (V-09) -- breaker_status now
      delegates. migration 021 creates model_usage_log, which this service has
      been writing to since before any migration created it (V-08).
