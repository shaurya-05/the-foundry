name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_WS_URL: ws://localhost:8000

  # ─── Backend ─────────────────────────────────────────────────────────────────
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_USER: foundry
          POSTGRES_PASSWORD: foundry_secret
          POSTGRES_DB: foundry_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foundry -d foundry_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/foundry_secret
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p foundry_secret 'RETURN 1;'"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Check every migration file is covered by something
        run: python scripts/check_migrations.py

      - name: Run migrations and verify fresh schema
        env:
          PGPASSWORD: foundry_secret
          LC_ALL: C
        run: |
          set -euo pipefail
          # Order comes from migrations/order.txt, not from a glob. A glob sorts
          # alphabetically, which is how 000b/000c ended up referencing a table
          # before the migration that creates it.
          while read -r f; do
            echo "Applying migrations/$f"
            psql -X -v ON_ERROR_STOP=1 -h localhost -U foundry -d foundry_db -f "migrations/$f"
          done < <(python scripts/check_migrations.py --print-order)
          psql -X -v ON_ERROR_STOP=1 -h localhost -U foundry -d foundry_db <<'SQL'
          SELECT column_name, data_type
          FROM information_schema.columns
          WHERE table_schema = 'public' AND table_name = 'copilot_messages'
            AND column_name IN ('thread_id', 'model_used')
          ORDER BY column_name;
          DO $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema = 'public' AND table_name = 'copilot_messages'
                AND column_name = 'thread_id' AND data_type = 'uuid'
            ) OR NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema = 'public' AND table_name = 'copilot_messages'
                AND column_name = 'model_used' AND data_type = 'text'
            ) THEN
              RAISE EXCEPTION 'Required copilot_messages columns are missing or incorrectly typed';
            END IF;
          END $$;
          SQL
      - name: Verify SQLite backend builds and enforces identity from cold
        # The desktop build (DATABASE_BACKEND=sqlite) has its own schema, which
        # no CI step touched before this one -- the Postgres glob does not
        # recurse into migrations/sqlite/. This drives the real permission code
        # against a database created from nothing.
        run: python scripts/verify_sqlite_identity.py

      - name: Check backend starts and health
        run: |
          set -euo pipefail
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..30}; do
            kill -0 "$server_pid"
            if curl -fsS --max-time 5 http://localhost:8000/health -o /tmp/health.json; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
          cat /tmp/health.json
          echo
          echo "GET /health: HTTP 200"
          # HTTP 401 is the expected success condition for invalid credentials.
          status=$(curl -sS --max-time 10 -X POST http://localhost:8000/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"test@test.com","password":"test"}' \
            -o /tmp/auth.json -w '%{http_code}')
          cat /tmp/auth.json
          echo
          echo "POST /api/auth/login: HTTP $status"
          test "$status" = 401
        env:
          DATABASE_URL: postgresql://foundry:foundry_secret@localhost:5432/foundry_db
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-secret-do-not-use-in-production
          ANTHROPIC_API_KEY: sk-test-placeholder
          VOYAGE_API_KEY: test-placeholder
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: foundry_secret
          ENVIRONMENT: ci

  # ─── Docker Build Check ─────────────────────────────────────────────────────
  docker:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build backend Docker image
        run: docker build -t foundry-backend ./backend
