# Phase 9 — unsigned macOS desktop package build.
# Manual only until proven reliable. Uploads .dmg/.zip as CI artifacts
# (Actions tab download) — does NOT create a GitHub Release or publish.

name: Build macOS

on:
  workflow_dispatch:

# Read-only by default at the repo level already, but make the ceiling
# explicit and self-documenting here too: this workflow only checks out,
# builds, and uploads a CI artifact — it never needs write access, even
# though a GH_TOKEN is passed through below for electron-builder's publish
# config probing (--publish never is what actually stops any publish).
permissions:
  contents: read

jobs:
  build-mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install desktop dependencies
        run: npm ci

      - name: Build unsigned macOS package (dmg + zip)
        run: npm run dist:mac
        env:
          # electron-builder may still probe publish config; keep it offline.
          GH_TOKEN: ${{ github.token }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: found3ry-macos-${{ github.run_id }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
          if-no-files-found: error
          retention-days: 14
