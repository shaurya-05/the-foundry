version: '3.9'

# Persistent, production-equivalent local stack — distinct from
# docker-compose.yml's dev containers (different container names, ports,
# and volumes) so the two never collide and dev testing never touches
# real user data. This is the target of the Railway->PC migration.
#
# Secrets come from .env.local-prod (gitignored) — run with:
#   docker compose -f docker-compose.local-prod.yml --env-file .env.local-prod up -d
#
# Ports are offset from the dev compose file (5433/6380 vs 5432/6379) so
# both can run simultaneously without conflict. Backend uses 8000, same
# as the dev setup did — only one is meant to be running at a time.

services:
  postgres_prod:
    image: pgvector/pgvector:pg18
    container_name: foundry_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: foundry
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_LOCAL_PROD}
      POSTGRES_DB: foundry_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foundry -d foundry_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis_prod:
    image: redis:7-alpine
    container_name: foundry_redis_prod
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend_prod:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: foundry_backend_prod
    restart: always
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://foundry:${POSTGRES_PASSWORD_LOCAL_PROD}@postgres_prod:5432/foundry_db
      REDIS_URL: redis://redis_prod:6379
      JWT_SECRET: ${JWT_SECRET_LOCAL_PROD}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD_LOCAL_PROD}
      ALLOWED_ORIGINS: "https://found3ry.com,https://www.found3ry.com,http://localhost:3000,http://localhost:3001"
      # ANTHROPIC_API_KEY has no local substitute (council/legacy paths) --
      # left blank means unconfigured (is_configured() returns False), not
      # a startup failure.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # RESEARCH/DOCUMENT's REAL capability (web search, knowledge-base
      # retrieval) needs these two -- blank means ai_router.py's
      # _UNCONFIGURED_TIER_CAVEATS fires instead of guessing. Both go
      # through the honest-fallback path until real keys are set here.
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      # CLASSIFIER + FACTUAL + STRATEGIC + RESEARCH + DOCUMENT -> local
      # Ollama, running directly on the Windows host (not in this compose
      # network), so the container reaches it via Docker's host gateway
      # hostname, not localhost. RESEARCH/DOCUMENT reuse STRATEGIC's
      # already-pulled qwen2.5:14b-instruct rather than adding a new model
      # to the OLLAMA_MAX_LOADED_MODELS=2 rotation -- see model_provider.py
      # Stage 11 comment.
      USE_LOCAL_CLASSIFIER: "1"
      USE_LOCAL_FACTUAL: "1"
      USE_LOCAL_STRATEGIC: "1"
      USE_LOCAL_RESEARCH: "1"
      USE_LOCAL_DOCUMENT: "1"
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      OLLAMA_API_KEY: ollama-local
      # Overriding MODEL_PROVIDER_ALLOWLIST replaces the default entirely
      # (see model_provider.py:82-86) -- must include every closed-API
      # host from the default plus host.docker.internal for Ollama.
      MODEL_PROVIDER_ALLOWLIST: "api.anthropic.com,api.openai.com,api.perplexity.ai,generativelanguage.googleapis.com,api.together.xyz,api.fireworks.ai,localhost,127.0.0.1,::1,host.docker.internal"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Real, direct disk access for H3RO's system_file_read/system_file_list
      # tools (backend/app/services/system_files_tool.py) -- distinct from
      # the browser-mediated list_files/read_file tools (file_access_tool.py),
      # which stay in place unchanged. Scoped to the user's own home
      # directory, not the whole C: drive (Windows/Program Files/other
      # accounts stay untouched), and mounted :ro so the container is
      # structurally incapable of writing or deleting anything here,
      # regardless of what any tool's application logic does or doesn't
      # check. The tool layer adds its own path-containment + sensitive-
      # path denylist on top -- see that file for the full reasoning.
      - C:/Users/shaur:/host_fs:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres_prod:
        condition: service_healthy
      redis_prod:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend_prod:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL_LOCAL_PROD}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL_LOCAL_PROD}
    container_name: foundry_frontend_prod
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      backend_prod:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_prod_data:
  redis_prod_data:
